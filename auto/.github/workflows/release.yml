name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --parallel

      - name: Test
        working-directory: build/ci
        run: ctest --output-on-failure

      - name: Package sources + binary tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/ci/auto_demo dist/
          tar -czf "dist/auto-pipeline-${VERSION}-linux-x64.tar.gz" \
            -C dist auto_demo

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
